<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    padding-top: 50px;
}

.container {
    width: 400px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

h1, h2 {
    text-align: center;
}

.options label {
    display: block;
    margin: 10px 0;
}

#password {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    font-size: 18px;
    box-sizing: border-box;
}

.buttons {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
}

button {
    padding: 10px;
    cursor: pointer;
}

ul {
    margin-top: 15px;
    padding-left: 20px;
}

li {
    margin-bottom: 5px;
    word-break: break-all;
}
</style>
</head>
<body>

    <div class="container">
        <h1>Password Generator</h1>

        <div class="options">
            <label>Password Length:</label>
            <input type="number" id="length" value="12" min="4" max="50">

            <label>
                <input type="checkbox" id="uppercase" checked>
                Uppercase (A-Z)
            </label>

            <label>
                <input type="checkbox" id="lowercase" checked>
                Lowercase (a-z)
            </label>

            <label>
                <input type="checkbox" id="numbers" checked>
                Numbers (0-9)
            </label>

            <label>
                <input type="checkbox" id="symbols" checked>
                Symbols (!@#$)
            </label>
        </div>

        <input type="text" id="password" readonly>

        <div class="buttons">
            <button onclick="generatePassword()">Generate</button>
            <button onclick="savePassword()">Save</button>
            <button onclick="clearSavedPasswords()">Clear Saved</button>
            <button onclick="downloadPasswords()">Download</button>
        </div>

        <h2>Saved Passwords</h2>
        <ul id="savedList"></ul>
    </div>

    <script>
const passwordBox = document.getElementById("password");
const savedList = document.getElementById("savedList");

loadPasswords();

function generatePassword() {
    const length = parseInt(document.getElementById("length").value);

    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lower = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+";

    let chars = "";

    if (document.getElementById("uppercase").checked) {
        chars += upper;
    }

    if (document.getElementById("lowercase").checked) {
        chars += lower;
    }

    if (document.getElementById("numbers").checked) {
        chars += numbers;
    }

    if (document.getElementById("symbols").checked) {
        chars += symbols;
    }

    if (chars === "") {
        alert("Select at least one option.");
        return;
    }

    let password = "";

    for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * chars.length);
        password += chars[randomIndex];
    }

    passwordBox.value = password;
}

function savePassword() {
    const password = passwordBox.value;

    if (password === "") {
        alert("Generate a password first.");
        return;
    }

    let passwords = JSON.parse(localStorage.getItem("passwords")) || [];

    passwords.push(password);

    localStorage.setItem("passwords", JSON.stringify(passwords));

    loadPasswords();
}

function loadPasswords() {
    const passwords = JSON.parse(localStorage.getItem("passwords")) || [];

    savedList.innerHTML = "";

    passwords.forEach(pass => {
        const li = document.createElement("li");
        li.textContent = pass;
        savedList.appendChild(li);
    });
}

function clearSavedPasswords() {
    const confirmDelete = confirm(
        "Are you sure you want to delete all saved passwords?"
    );

    if (confirmDelete) {
        localStorage.removeItem("passwords");

        savedList.innerHTML = "";

        alert("All saved passwords have been deleted.");
    }
}

function downloadPasswords() {
    const passwords = JSON.parse(localStorage.getItem("passwords")) || [];

    if (passwords.length === 0) {
        alert("No saved passwords.");
        return;
    }

    const blob = new Blob(
        [passwords.join("\n")],
        { type: "text/plain" }
    );

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);

    link.download = "passwords.txt";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}
</script>

</body>
</html>
